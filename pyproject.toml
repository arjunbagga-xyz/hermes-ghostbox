[build-system]
requires = ["setuptools>=68.0,<72.0", "wheel>=0.42,<1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-ghostbox"
version = "0.1.0"
description = "Speculative shadow-execution sandbox and cryptographic blast-radius verifier for autonomous agent tools."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Arjun Bagga", email = "arjunbagga.xyz@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5,<3.0",
    "fastapi>=0.109,<1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
]

[tool.setuptools]
py-modules = []
packages = []

